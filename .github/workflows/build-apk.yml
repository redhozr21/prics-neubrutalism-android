name: Build Prics Play Android

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version to build, e.g. 2.3.5'
        required: false
        type: string

  push:
    branches: [main]
    paths:
      - '*.zip'

permissions:
  contents: write

concurrency:
  group: prics-play-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract and validate project ZIP
        id: extract
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          archive_version=''
          requested_version="${REQUESTED_VERSION:-}"

          if [ -n "$requested_version" ]; then
            if ! [[ "$requested_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Version must use semantic X.Y.Z format, e.g. 2.3.5"
              exit 1
            fi

            archive="Prics-Play-${requested_version}-Android.zip"

            if [ ! -f "$archive" ]; then
              echo "::error::Required archive '$archive' is not present in the repository root."
              exit 1
            fi

            archive_version="$requested_version"
          else
            mapfile -t versioned_archives < <(
              find . -maxdepth 1 -type f \
                -name 'Prics-Play-[0-9]*-Android.zip' \
                -printf '%f\n' | sort -V
            )

            if [ "${#versioned_archives[@]}" -gt 0 ]; then
              archive="${versioned_archives[$((${#versioned_archives[@]} - 1))]}"

              if [[ "$archive" =~ ^Prics-Play-([0-9]+\.[0-9]+\.[0-9]+)-Android\.zip$ ]]; then
                archive_version="${BASH_REMATCH[1]}"
              else
                echo "::error::Invalid versioned ZIP filename: $archive"
                exit 1
              fi
            elif [ -f Prics-Play-Finetune-Android.zip ]; then
              archive='Prics-Play-Finetune-Android.zip'
            elif [ -f prics-neubrutalism-android.zip ]; then
              archive='prics-neubrutalism-android.zip'
            else
              echo "::error::No Prics Play source ZIP found."
              exit 1
            fi
          fi

          echo "Using source archive: $archive"
          unzip -q "$archive" -d source

          package_file="$(find source -mindepth 2 -maxdepth 3 \
            -type f -name package.json -print -quit)"

          if [ -z "$package_file" ]; then
            echo "::error::Cannot locate package.json inside the ZIP."
            exit 1
          fi

          project_dir="${package_file%/package.json}"
          package_name="$(node -p "require('./$package_file').name")"
          package_version="$(node -p "require('./$package_file').version")"

          if [ "$package_name" != 'prics-play' ]; then
            echo "::error::Unexpected package name: $package_name"
            exit 1
          fi

          if [ -n "$archive_version" ] &&
             [ "$package_version" != "$archive_version" ]; then
            echo "::error::ZIP version does not match package.json."
            exit 1
          fi

          if ! [[ "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid package version: $package_version"
            exit 1
          fi

          echo "project_dir=$project_dir" >> "$GITHUB_OUTPUT"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          echo "Validated version: $package_version"

      - name: Install dependencies
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: npm ci --no-audit --no-fund

      - name: Build mobile bundle
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: node mobile/build.mjs

      - name: Sync Android project
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: npx cap sync android

      # IMPORTANT:
      # Restore only the existing key. If it is missing or different, stop before Gradle
      # can silently create a new debug.keystore.
      - name: Restore existing debug signing key
        id: signing_key_cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: prics-play-debug-keystore-v1

      - name: Verify restored signing certificate
        shell: bash
        env:
          CACHE_HIT: ${{ steps.signing_key_cache.outputs.cache-hit }}
          EXPECTED_CERT_SHA256: A31F0FE0D1C4F95C4D368432E12AE37591998BD8172086BFFACED9B731DACC2C
        run: |
          set -euo pipefail

          if [ "$CACHE_HIT" != "true" ]; then
            echo "::error::Original signing-key cache was not found."
            echo "Build stopped. No new signing key will be generated."
            exit 1
          fi

          KEYSTORE="$HOME/.android/debug.keystore"

          if [ ! -s "$KEYSTORE" ]; then
            echo "::error::Restored debug.keystore is missing or empty."
            exit 1
          fi

          KEY_INFO="$(keytool -list -v \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey)"

          ACTUAL_CERT="$(printf '%s\n' "$KEY_INFO" |
            sed -nE 's/^[[:space:]]*SHA256: (.*)$/\1/p' |
            head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"

          if [ -z "$ACTUAL_CERT" ]; then
            echo "::error::Could not read SHA-256 fingerprint from restored keystore."
            exit 1
          fi

          if [ "$ACTUAL_CERT" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Restored signing certificate does not match installed 3.4.0 APK."
            echo "Expected: $EXPECTED_CERT_SHA256"
            echo "Actual:   $ACTUAL_CERT"
            exit 1
          fi

          echo "Existing 3.4.0 signing certificate verified."

      - name: Build APK
        working-directory: ${{ steps.extract.outputs.project_dir }}/android
        env:
          MURIEL_VERSION_CODE: ${{ github.run_number }}
          MURIEL_VERSION_NAME: ${{ steps.extract.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify built APK certificate
        working-directory: ${{ steps.extract.outputs.project_dir }}
        shell: bash
        env:
          EXPECTED_CERT_SHA256: A31F0FE0D1C4F95C4D368432E12AE37591998BD8172086BFFACED9B731DACC2C
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -s "$APK" ]; then
            echo "::error::Built APK was not found."
            exit 1
          fi

          if [ ! -d "$SDK_ROOT/build-tools" ]; then
            echo "::error::Android SDK build-tools directory was not found: $SDK_ROOT/build-tools"
            exit 1
          fi

          APKSIGNER="$(find "$SDK_ROOT/build-tools" \
            -type f -name apksigner -print | sort -V | tail -n 1)"

          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner was not found."
            exit 1
          fi

          SIGNATURE="$("$APKSIGNER" verify --print-certs "$APK")"
          echo "$SIGNATURE"

          ACTUAL_CERT="$(printf '%s\n' "$SIGNATURE" |
            awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {
              gsub(/:/, "", $2);
              print toupper($2);
              exit
            }')"

          if [ "$ACTUAL_CERT" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Final APK signing certificate mismatch."
            echo "Expected: $EXPECTED_CERT_SHA256"
            echo "Actual:   $ACTUAL_CERT"
            exit 1
          fi

          echo "Final APK certificate verified successfully."

      - name: Prepare APK and SHA-256 checksum
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          set -euo pipefail

          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "$GITHUB_WORKSPACE/Prics-Play.apk"

          cd "$GITHUB_WORKSPACE"
          sha256sum Prics-Play.apk > Prics-Play.apk.sha256

          echo "APK and checksum prepared."
          cat Prics-Play.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Prics-Play-debug-apk
          path: |
            Prics-Play.apk
            Prics-Play.apk.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Publish permanent versioned release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.extract.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          head="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"

          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "main has moved; skipping stale release."
            exit 0
          fi

          tag="v${APP_VERSION}"

          highest_version="$(
            {
              find . -maxdepth 1 -type f \
                -name 'Prics-Play-[0-9]*-Android.zip' \
                -printf '%f\n' |
                sed -nE \
                  's/^Prics-Play-([0-9]+\.[0-9]+\.[0-9]+)-Android\.zip$/\1/p'

              gh api --paginate \
                "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                --jq '.[].tag_name' |
                sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+)$/\1/p'
            } | sort -V | tail -n 1
          )"

          if gh release view "$tag" >/dev/null 2>&1; then
            asset_names="$(gh release view "$tag" --json assets --jq '.assets[].name')"

            if ! grep -Fxq 'Prics-Play.apk' <<< "$asset_names"; then
              echo "::error::Release $tag exists but has no APK."
              echo "Existing release was not changed."
              exit 1
            fi

            tmpdir="$(mktemp -d)"
            trap 'rm -rf "$tmpdir"' EXIT

            gh release download "$tag" \
              --pattern 'Prics-Play.apk' \
              --dir "$tmpdir"

            if grep -Fxq 'Prics-Play.apk.sha256' <<< "$asset_names"; then
              gh release download "$tag" \
                --pattern 'Prics-Play.apk.sha256' \
                --dir "$tmpdir"

              (
                cd "$tmpdir"
                sha256sum -c Prics-Play.apk.sha256
              )
              echo "Existing release $tag and checksum are valid."
            else
              (
                cd "$tmpdir"
                sha256sum Prics-Play.apk > Prics-Play.apk.sha256
              )

              gh release upload "$tag" \
                "$tmpdir/Prics-Play.apk.sha256"

              echo "Added missing checksum to existing release $tag."
            fi

            exit 0
          fi

          if [ "$APP_VERSION" = "$highest_version" ]; then
            latest_args=(--latest)
            echo "$tag is the highest version."
          else
            latest_args=(--latest=false)
            echo "$tag is a historical version."
          fi

          gh release create "$tag" \
            "$GITHUB_WORKSPACE/Prics-Play.apk" \
            "$GITHUB_WORKSPACE/Prics-Play.apk.sha256" \
            "${latest_args[@]}" \
            --target "$GITHUB_SHA" \
            --title "Prics Play ${APP_VERSION}" \
            --notes "Prics Play ${APP_VERSION}. Android debug APK built from commit ${GITHUB_SHA:0:7}. Download Prics-Play.apk to install. Verify it with Prics-Play.apk.sha256. This is a debug-signed APK; updates require the same signing certificate.<!-- prics-play-version: ${APP_VERSION} --><!-- prics-play-build: ${GITHUB_RUN_NUMBER} -->"
