name: Build Prics Play Android (debug artifact)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional exact version to rebuild, e.g. 1.3.9. Leave blank to build the highest versioned ZIP.'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

concurrency:
  group: prics-play-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract and validate project ZIP
        id: extract
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          archive_version=''
          requested_version="${REQUESTED_VERSION:-}"

          if [ -n "$requested_version" ]; then
            if ! [[ "$requested_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Version must use semantic X.Y.Z format, e.g. 1.3.9"
              exit 1
            fi
            archive="Prics-Play-${requested_version}-Android.zip"
            if [ ! -f "$archive" ]; then
              echo "::error::Required archive '$archive' is not present in the repository root."
              exit 1
            fi
            archive_version="$requested_version"
          else
            mapfile -t versioned_archives < <(
              find . -maxdepth 1 -type f -name 'Prics-Play-[0-9]*-Android.zip' -printf '%f\n' | sort -V
            )

            if [ "${#versioned_archives[@]}" -gt 0 ]; then
              archive="${versioned_archives[$((${#versioned_archives[@]} - 1))]}"
              if [[ "$archive" =~ ^Prics-Play-([0-9]+\.[0-9]+\.[0-9]+)-Android\.zip$ ]]; then
                archive_version="${BASH_REMATCH[1]}"
              else
                echo "::error::Selected archive does not use the expected version filename: $archive"
                exit 1
              fi
            elif [ -f Prics-Play-Finetune-Android.zip ]; then
              archive='Prics-Play-Finetune-Android.zip'
            elif [ -f prics-neubrutalism-android.zip ]; then
              archive='prics-neubrutalism-android.zip'
            else
              echo 'No Prics Play source ZIP found in the repository root.' >&2
              exit 1
            fi
          fi

          echo "Using source archive: $archive"
          7z x -y "$archive" -osource 2>/dev/null || unzip -q "$archive" -d source

          package_file="$(find source -mindepth 2 -maxdepth 2 -type f -name package.json -print -quit)"
          if [ -z "$package_file" ]; then
            echo 'Could not locate the project package.json inside the ZIP.' >&2
            exit 1
          fi

          project_dir="${package_file%/package.json}"
          package_name="$(node -p "require('./$package_file').name")"
          package_version="$(node -p "require('./$package_file').version")"

          if [ "$package_name" != 'prics-play' ]; then
            echo "::error::Unexpected package name '$package_name' in $archive"
            exit 1
          fi

          if [ -n "$archive_version" ] && [ "$package_version" != "$archive_version" ]; then
            echo "::error::ZIP filename version $archive_version does not match package.json version $package_version"
            exit 1
          fi

          if ! [[ "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json version must be semantic X.Y.Z; found '$package_version'"
            exit 1
          fi

          echo "project_dir=$project_dir" >> "$GITHUB_OUTPUT"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          echo "Using project directory: $project_dir"
          echo "Validated app version: $package_version"

      - name: Install dependencies
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: npm ci --no-audit --no-fund

      - name: Build mobile bundle
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: node mobile/build.mjs

      - name: Sync Android project
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: npx cap sync android

      # Use permanent stable release signing key
      - name: Setup release keystore
        shell: bash
        env:
          MURIEL_KEYSTORE_BASE64: ${{ secrets.MURIEL_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          ks_dir="${{ steps.extract.outputs.project_dir }}/android/keystores"
          ks_path="$ks_dir/prics-play-release.keystore"
          mkdir -p "$ks_dir"

          if [ -n "${MURIEL_KEYSTORE_BASE64:-}" ]; then
            echo "Decoding custom release keystore from GitHub secrets..."
            echo "$MURIEL_KEYSTORE_BASE64" | base64 -d > "$ks_path"
          elif [ ! -f "$ks_path" ] || ! keytool -list -keystore "$ks_path" -storepass pricsplay2026 >/dev/null 2>&1; then
            echo "Generating authentic Java release keystore with keytool..."
            rm -f "$ks_path"
            keytool -genkeypair -v \
              -keystore "$ks_path" \
              -alias pricsplay \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storetype PKCS12 \
              -storepass pricsplay2026 \
              -keypass pricsplay2026 \
              -dname "CN=Prics Play, OU=Mobile, O=Prics, C=ID"
          fi
          echo "Verified release keystore:"
          keytool -list -v -keystore "$ks_path" -storepass pricsplay2026 || true

      - name: Build APK
        working-directory: ${{ steps.extract.outputs.project_dir }}/android
        env:
          MURIEL_VERSION_CODE: ${{ github.run_number }}
          MURIEL_VERSION_NAME: ${{ steps.extract.outputs.version }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK and checksum
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Prics-Play-TV.apk"
          cd "$GITHUB_WORKSPACE"
          sha256sum Prics-Play-TV.apk > Prics-Play-TV.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Prics-Play-TV-debug-apk
          path: |
            Prics-Play-TV.apk
            Prics-Play-TV.apk.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Publish or update GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.extract.outputs.version }}
          name: Prics Play TV ${{ steps.extract.outputs.version }}
          files: |
            Prics-Play-TV.apk
            Prics-Play-TV.apk.sha256
          make_latest: false

      - name: Explain debug artifact scope
        run: |
          {
            echo "## Release and APK Artifact"
            echo "Successfully built and published Prics Play ${{ steps.extract.outputs.version }} to GitHub Releases."
          } >> "$GITHUB_STEP_SUMMARY"
