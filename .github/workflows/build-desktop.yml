name: Build Prics Play Desktop (Windows, macOS, Linux)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-desktop.yml'

permissions:
  contents: write

concurrency:
  group: prics-play-desktop-build
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract project archive
        id: extract
        shell: pwsh
        run: |
          $archives = Get-ChildItem -Path . -Filter "Prics-Play-*-Android.zip" | Where-Object { $_.Name -match '^Prics-Play-\d' }
          if (-not $archives) {
            Write-Error "No Prics Play source ZIP found"
            exit 1
          }
          $archive = ($archives | Sort-Object Name)[-1].Name
          Write-Host "Extracting $archive..."
          Expand-Archive -Path $archive -DestinationPath "source" -Force
          $pkg = Get-ChildItem -Path "source" -Recurse -Filter "package.json" | Select-Object -First 1
          $projectDir = $pkg.DirectoryName
          $ver = (Get-Content $pkg.FullName | ConvertFrom-Json).version
          Write-Host "Project dir: $projectDir, Version: $ver"
          "project_dir=$projectDir" >> $env:GITHUB_OUTPUT
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: npm ci --no-audit --no-fund

      - name: Build Windows Executable
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Publish Windows .exe to Release
        shell: pwsh
        working-directory: ${{ steps.extract.outputs.project_dir }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem -Path dist -Filter "*.exe" | Select-Object -First 1
          if ($exe) {
            Write-Host "Uploading $($exe.Name) to Release v3.2.0..."
            gh release upload v3.2.0 $exe.FullName --clobber
            Write-Host "Uploaded $($exe.Name) successfully!"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Prics-Play-Windows-exe
          path: ${{ steps.extract.outputs.project_dir }}/dist/*.exe
          retention-days: 14

  build-mac:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract project archive
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          archive="$(ls -1 Prics-Play-*-Android.zip 2>/dev/null | tail -n 1)"
          if [ -z "$archive" ]; then
            echo "::error::No source ZIP found"
            exit 1
          fi
          echo "Extracting $archive..."
          unzip -q "$archive" -d source
          pkg="$(find source -mindepth 2 -maxdepth 2 -type f -name package.json -print -quit)"
          project_dir="${pkg%/package.json}"
          ver="$(node -p "require('./$pkg').version")"
          echo "project_dir=$project_dir" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: npm ci --no-audit --no-fund

      - name: Build macOS DMG
        working-directory: ${{ steps.extract.outputs.project_dir }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac dmg --universal --publish never

      - name: Publish macOS .dmg to Release
        shell: bash
        working-directory: ${{ steps.extract.outputs.project_dir }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dmg="$(find dist -name "*.dmg" -type f | head -n 1)"
          if [ -n "$dmg" ]; then
            echo "Uploading $dmg to Release v3.2.0..."
            gh release upload v3.2.0 "$dmg" --clobber
            echo "Uploaded $dmg successfully!"
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Prics-Play-macOS-dmg
          path: ${{ steps.extract.outputs.project_dir }}/dist/*.dmg
          retention-days: 14

  build-linux:
    name: Build Linux (.AppImage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract project archive
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          archive="$(ls -1 Prics-Play-*-Android.zip 2>/dev/null | tail -n 1)"
          if [ -z "$archive" ]; then
            echo "::error::No source ZIP found"
            exit 1
          fi
          echo "Extracting $archive..."
          unzip -q "$archive" -d source
          pkg="$(find source -mindepth 2 -maxdepth 2 -type f -name package.json -print -quit)"
          project_dir="${pkg%/package.json}"
          ver="$(node -p "require('./$pkg').version")"
          echo "project_dir=$project_dir" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: npm ci --no-audit --no-fund

      - name: Build Linux AppImage
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: npx electron-builder --linux AppImage --publish never

      - name: Publish Linux .AppImage to Release
        shell: bash
        working-directory: ${{ steps.extract.outputs.project_dir }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          appimage="$(find dist -name "*.AppImage" -type f | head -n 1)"
          if [ -n "$appimage" ]; then
            echo "Uploading $appimage to Release v3.2.0..."
            gh release upload v3.2.0 "$appimage" --clobber
            echo "Uploaded $appimage successfully!"
          fi

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Prics-Play-Linux-AppImage
          path: ${{ steps.extract.outputs.project_dir }}/dist/*.AppImage
          retention-days: 14